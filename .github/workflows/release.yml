name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $cmd = Get-Command ffmpeg
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $cmd.Source)
          ffmpeg -version

      - name: Test
        run: dotnet test tests/WebcamStream.Tests/WebcamStream.Tests.csproj -c Release

      - name: Publish self-contained exe
        shell: pwsh
        run: |
          dotnet publish src/WebcamStream/WebcamStream.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist/win-x64
          Copy-Item config/config.jsonc dist/win-x64/config.jsonc
          Copy-Item scripts/Install-WebcamStream.ps1 dist/win-x64/
          Copy-Item scripts/Uninstall-WebcamStream.ps1 dist/win-x64/
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/WebcamStream-win-x64.zip -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/WebcamStream/WebcamStream.csproj | head -n 1)"
          tag="v$version"
          notes="$(cat <<EOF
          WebcamStream $version for 64-bit Windows 10 (version 1607) or later.

          WebcamStream.exe is self-contained. Do not install a .NET runtime to run it.

          --console exits with an error if the camera does not deliver a frame within 8 seconds. It does not stay suspended waiting on Windows.

          The zip also contains config.jsonc, Install-WebcamStream.ps1, and Uninstall-WebcamStream.ps1.
          Unzip it, open an elevated PowerShell in that folder, and run one of:

            .\Install-WebcamStream.ps1 -Mode ScheduledTask -Start
            .\Install-WebcamStream.ps1 -Mode Service -Start

          The program is installed to C:\ProgramData\WebcamStream.
          ExacqVision address: rtsp://THIS-PC:554/webcam
          Username webcam, password webcam1, unless config.jsonc says otherwise.

          To build from source instead, install the .NET 8 SDK (x64).
          A framework-dependent build needs the .NET 8 Runtime (x64), the package named ".NET Runtime", not the Desktop Runtime and not the ASP.NET Core Runtime. winget id: Microsoft.DotNet.Runtime.8
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/win-x64/WebcamStream.exe dist/WebcamStream-win-x64.zip --clobber
          else
            gh release create "$tag" dist/win-x64/WebcamStream.exe dist/WebcamStream-win-x64.zip \
              --title "WebcamStream $version" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
